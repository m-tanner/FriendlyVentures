runtime: nodejs22

instance_class: F1
automatic_scaling:
  max_instances: 1

# Fallback only: every URL below is served statically by Google Frontend,
# so no instance should ever spin up for normal traffic.
entrypoint: node server.js

handlers:
  - url: /assets
    static_dir: dist/assets
    secure: always
    expiration: 365d

  - url: /images
    static_dir: dist/images
    secure: always
    expiration: 7d

  - url: /manifest\.webmanifest$
    static_files: dist/manifest.webmanifest
    upload: dist/manifest\.webmanifest
    mime_type: application/manifest+json
    secure: always

  # Kill-switch worker for the pre-2026 CRA service worker; must be served
  # as JavaScript and never cached so zombie workers update immediately.
  - url: /service-worker\.js$
    static_files: dist/service-worker.js
    upload: dist/service-worker\.js
    secure: always
    expiration: 0s
    http_headers:
      Cache-Control: no-cache

  - url: /(favicon\.ico|favicon\.svg|apple-touch-icon\.png|icon-192\.png|icon-512\.png|og\.png|robots\.txt|MichaelTanner_Resume\.pdf)$
    static_files: dist/\1
    upload: dist/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|icon-192\.png|icon-512\.png|og\.png|robots\.txt|MichaelTanner_Resume\.pdf)$
    secure: always
    expiration: 1d

  # index.html hard-references content-hashed bundles, so it must never be
  # cached: a stale copy would point at assets that no longer exist.
  - url: .*
    static_files: dist/index.html
    upload: dist/index\.html
    secure: always
    expiration: 0s
    http_headers:
      Cache-Control: no-cache
